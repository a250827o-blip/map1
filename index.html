<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>千葉県観光地マップ</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
        .leaflet-popup-content img {
            max-width: 150px;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }
        .custom-icon {
            border-radius: 50%; /* Make icons circular */
            border: 2px solid #fff; /* Add a white border */
            box-shadow: 0 0 5px rgba(0,0,0,0.5); /* Add a subtle shadow */
        }
    </style>
</head>
<body>

<h2>千葉県の観光地マップ</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // 地図を作成
    var map = L.map('map').setView([35.605, 140.123], 9);

    // OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 観光地データ
    var spots = [
        {
            name: "東京ディズニーランド",
            lat: 35.6329,
            lng: 139.8804,
            url: "https://www.tokyodisneyresort.jp/",
            image: "ミッキー.png"
        },
        {
            name: "鴨川シーワールド",
            lat: 35.1157,
            lng: 140.1130,
            url: "https://www.kamogawa-seaworld.jp/",
            image: "鴨シー2026-06-02 005720.png"
        },
        {
            name: "マザー牧場",
            lat: 35.2502,
            lng: 139.9625,
            url: "https://www.motherfarm.co.jp/",
            image: "マザー牧場.png"
        },
        {
            name: "東京ドイツ村",
            lat: 35.4275,
            lng: 140.0586,
            url: "https://t-doitsumura.co.jp/",
            image: "images.png"
        },
        {
            name: "ふなばしアンデルセン公園",
            lat: 35.7574,
            lng: 140.0556,
            url: "https://www.park-funabashi.or.jp/and/",
            image: "アンデルセン.png"
        },
        {
            name: "三井アウトレットパーク 木更津",
            lat: 35.4262,
            lng: 139.9866,
            url: "https://mitsui-shopping-park.com/mop/kisarazu/",
            image: "三井アウトレットパーク2026-06-02 012835.png"
        },
        {
            name: "養老渓谷",
            lat: 35.2586,
            lng: 140.1176,
            url: "https://www.yorokeikoku.com/",
            image: "スクリーンショット 2026-06-02 012916.png"
        },
        {
            name: "銚子電鉄",
            lat: 35.7265,
            lng: 140.8252,
            url: "https://www.choshi-dentetsu.jp/",
            image: "スクリーンショット 2026-06-02 012950.png"
        },
        {
            name: "幕張メッセ",
            lat: 35.6481,
            lng: 140.0381,
            url: "https://www.m-messe.co.jp/",
            image: "スクリーンショット 2026-06-02 013027.png"
        },
        {
            name: "九十九里浜",
            lat: 35.4851,
            lng: 140.3857,
            url: "https://kujukuri.jp/",
            image: "スクリーンショット 2026-06-02 013057.png"
        }
    ];


    // マーカー追加
    spots.forEach(function(spot) {
        // Create a custom icon for each spot
        var customIcon = L.icon({
            iconUrl: spot.image, // Use the image URL from the spot data
            iconSize: [50, 50], // Size of the icon
            iconAnchor: [20, 40], // Point of the icon which will correspond to marker's location
            popupAnchor: [0, -40], // Point from which the popup should open relative to the iconAnchor
            className: 'custom-icon' // Add a class for custom styling
        });

        var marker = L.marker([spot.lat, spot.lng], {icon: customIcon})
          .addTo(map)
          .bindPopup(
            "<h3>" + spot.name + "</h3>" +
            "<a href='" + spot.url +
            "' target='_blank'>公式サイトへ</a>"
          );

        // Add click event to marker to zoom in
        marker.on('click', function() {
            map.setView([spot.lat, spot.lng], 13); // Zoom to level 13
        });
    });
</script>

</body>
</html>
